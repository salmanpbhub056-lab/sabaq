<section><div class="w"><h2>${I('sparkles','Top rated')}</h2><div class="grid">${n.sort((a,b)=>rating(b)-rating(a)).slice(0,6).map(card).join('')}</div>
<p class="row" style="margin-top:20px"><a class="btn" href="#/search">${I('layout-grid','Browse all '+n.length)}</a><a class="btn alt" href="#/match">${I('wand-sparkles','Help me choose')}</a></p></div></section>
<section style="background:#fff"><div class="w"><h2>How Sabaq works</h2><div class="grid">${[['search','Search','Filter by level, subject, area, budget and mode.'],['git-compare','Compare','Check fees, reviews and verification side by side.'],['calendar-check','Book a demo','Request a trial class or message on WhatsApp.'],['message-square-heart','Review','Students with a demo request can leave a verified review.']].map(f=>`<div class="feat">${I(f[0])}<div><h3 style="margin:0">${f[1]}</h3><span class="mut">${f[2]}</span></div></div>`).join('')}</div></div></section>`}

function search(){return `<section><div class="w"><h2>Find a tutor or academy</h2><div class="lay"><form class="panel" onsubmit="event.preventDefault()" aria-label="Filters"><label for="fq">Search</label><input id="fq" value="${esc(F.q)}" oninput="sf('q',this.value)" placeholder="physics Gulshan">
${sel('lv',LV,'Level')}${sel('su',SU,'Subject')}${sel('ar',AR,'Area')}${sel('mo',['Home','Academy','Online'],'Mode')}
<label for="fty">Type</label><select id="fty" onchange="sf('ty',this.value)"><option value="">All</option><option value="t" ${F.ty=='t'?'selected':''}>Tutors</option><option value="a" ${F.ty=='a'?'selected':''}>Academies</option></select>
<label for="fg">Tutor gender</label><select id="fg" onchange="sf('g',this.value)"><option value="">Any</option><option value="F" ${F.g=='F'?'selected':''}>Female</option><option value="M" ${F.g=='M'?'selected':''}>Male</option></select>
<label for="fmx">Max fee: <b id="mxv">${pkr(F.mx)}</b>/mo</label><input id="fmx" type="range" min="2000" max="30000" step="1000" value="${F.mx}" oninput="$('#mxv').textContent=pkr(this.value);sf('mx',+this.value)">
<label for="fso">Sort by</label><select id="fso" onchange="sf('so',this.value)"><option value="rt">Top rated</option><option value="fa" ${F.so=='fa'?'selected':''}>Fee: low to high</option><option value="fd" ${F.so=='fd'?'selected':''}>Fee: high to low</option></select>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" ${F.vf?'checked':''} onchange="sf('vf',this.checked?1:0)">Verified only</label>
<button class="btn alt sm" type="button" style="margin-top:14px" onclick="F={...DF};route()">${I('rotate-ccw','Reset filters')}</button></form><div id="res"></div></div></div></section>`}

function prof(id){const x=get(id);if(!x)return `<section><div class="w">Listing not found. <a href="#/search">Back to search</a></div></section>`;
const rv=S.rev.filter(v=>v.l==x.id),can=S.req.some(r=>r.l==x.id),wa=`https://wa.me/${x.ph}?text=${encodeURIComponent('Salam, I found you on Sabaq and would like a demo class.')}`;
return `<section><div class="w"><a href="#/search" class="btn ghost sm">${I('arrow-left','Back to results')}</a><div class="lay" style="margin-top:16px;grid-template-columns:1fr 300px"><div><div class="top"><div class="av ${x.t=='a'?'a':''}" style="width:68px;height:68px;font-size:1.3rem">${esc(ini(x.n))}</div><div><h1 style="font-size:1.8rem;margin:0">${esc(x.n)}</h1><div class="mut">${x.t=='a'?'Academy':'Tutor'} · ${I('map-pin')} ${esc(x.a)}, Karachi · ${x.x} years</div></div></div>
<p>${ver(x)?`<span class="tag v">${I('shield-check','Verified: phone, CNIC and qualifications checked')}</span>`:'<span class="tag">Not verified yet</span>'}<span class="tag"><span class="star">${I('star')}</span> ${rating(x).toFixed(1)}</span></p><p>${esc(x.b)}</p>
<div class="sc"><table><tr><th>Levels</th><td>${x.l.join(', ')}</td></tr><tr><th>Subjects</th><td>${x.s.map(esc).join(', ')}</td></tr><tr><th>Fee</th><td>${pkr(x.f)} per month</td></tr><tr><th>Mode</th><td>${x.m.join(', ')}</td></tr><tr><th>${x.t=='a'?'Facilities':'Timings'}</th><td>${esc(x.h)}</td></tr></table></div>
<p class="row"><a class="btn" href="${wa}" target="_blank" rel="noopener">${I('message-circle','WhatsApp')}</a><a class="btn alt" href="tel:+${x.ph}">${I('phone','Call')}</a><a class="btn alt" target="_blank" rel="noopener" href="https://www.google.com/maps/search/${encodeURIComponent(x.n+' '+x.a+' Karachi')}">${I('map','Map')}</a><button class="btn alt" onclick="tg(${x.id})">${I('heart',S.saved.includes(x.id)?'Saved':'Save')}</button><button class="btn alt" onclick="tc(${x.id});toast('Compare list updated')">${I('git-compare','Compare')}</button><button class="btn alt" onclick="sh(${x.id})">${I('share-2','Share')}</button></p>
<h2>Reviews (${rv.length})</h2>${rv.map(v=>`<div class="card" style="margin-bottom:10px"><div><span class="star">${I('star')}</span> <b>${v.s}/5</b> · ${esc(v.w)} ${v.v?`<span class="tag v">${I('check','Verified booking')}</span>`:''}</div>${esc(v.t)}</div>`).join('')||'<p class="mut">No reviews yet.</p>'}
${can?`<form class="panel" onsubmit="rv(event,${x.id})"><h3>Write a verified review</h3><label>Your name</label><input name="w" required maxlength="40"><label>Rating</label><select name="s"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><label>Review</label><textarea name="t" required maxlength="300"></textarea><button class="btn" style="margin-top:12px">${I('send','Post review')}</button></form>`:`<div class="note">${I('lock')}<span>Only students who requested a demo can post reviews. This keeps ratings honest.</span></div>`}</div>
<aside><form class="panel" onsubmit="rq(event,${x.id})"><h3>${I('calendar-check','Request a demo class')}</h3><label>Student name</label><input name="n" required maxlength="40"><label>Phone</label><input name="p" required pattern="[0-9+ \\-]{10,15}" placeholder="03XX XXXXXXX"><label>Preferred time</label><input name="tm" placeholder="e.g. weekdays after 5pm"><button class="btn" style="margin-top:14px;width:100%">${I('send','Send request')}</button></form>
<p><button class="btn red sm" onclick="rp(${x.id})">${I('flag','Report this listing')}</button></p></aside></div></div></section>`}

function cmpv(){const a=cmp.map(get).filter(Boolean);if(a.length<2)return `<section><div class="w"><h2>Compare</h2><p>Tick the Compare box on 2 or 3 listings, then return here.</p><a class="btn" href="#/search">${I('search','Find listings')}</a></div></section>`;
const r=(l,f)=>`<tr><th>${l}</th>${a.map(x=>`<td>${f(x)}</td>`).join('')}</tr>`;
return `<section><div class="w"><h2>Compare</h2><div class="sc"><table><tr><th></th>${a.map(x=>`<th><a href="#/p/${x.id}">${esc(x.n)}</a></th>`).join('')}</tr>${r('Type',x=>x.t=='a'?'Academy':'Tutor')}${r('Area',x=>x.a)}${r('Fee / month',x=>pkr(x.f))}${r('Rating',x=>rating(x).toFixed(1)+' / 5')}${r('Verified',x=>ver(x)?'Yes':'No')}${r('Levels',x=>x.l.join(', '))}${r('Subjects',x=>x.s.join(', '))}${r('Mode',x=>x.m.join(', '))}${r('Experience',x=>x.x+' yrs')}</table></div><p><button class="btn alt" onclick="cmp=[];bar();route()">${I('x','Clear')}</button></p></div></section>`}

function match(){return `<section><div class="w"><h2>Smart match</h2><p class="mut">Answer five questions and get your top three.</p><form class="panel" style="max-width:520px" onsubmit="mt(event)">${[['lv','Level',LV],['su','Subject',SU],['ar','Area',AR],['mo','Learning style',['Home','Academy','Online']]].map(q=>`<label>${q[1]}</label><select name="${q[0]}" required>${opts(q[2],'','Choose')}</select>`).join('')}<label>Monthly budget (Rs)</label><input name="b" type="number" min="1000" value="10000"><button class="btn" style="margin-top:14px">${I('wand-sparkles','Show my matches')}</button></form><div id="mr" style="margin-top:24px"></div></div></section>`}
function mt(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
const r=all().filter(x=>x.ok).map(x=>({x,sc:(x.l.includes(d.lv)?3:0)+(x.s.includes(d.su)?3:0)+(x.f<=+d.b?2:0)+(x.a==d.ar?2:0)+(x.m.includes(d.mo)?1:0)+(ver(x)?.5:0)+rating(x)/10})).sort((a,b)=>b.sc-a.sc).slice(0,3);
$('#mr').innerHTML=`<h3>Your top 3</h3><div class="grid">${r.map(o=>card(o.x)).join('')}</div>`;ico()}

function fees(){const row=l=>{const a=all().filter(x=>x.ok&&x.l.includes(l)).map(x=>x.f);return a.length?`<tr><td>${l}</td><td>${pkr(Math.min(...a))}</td><td><b>${pkr(Math.round(a.reduce((p,c)=>p+c,0)/a.length))}</b></td><td>${pkr(Math.max(...a))}</td><td>${a.length}</td></tr>`:''};
return `<section><div class="w"><h2>${I('wallet','Fee transparency')}</h2><p class="mut">Monthly fee ranges from current listings, so you know what is fair.</p><div class="sc"><table><tr><th>Level</th><th>Lowest</th><th>Average</th><th>Highest</th><th>Listings</th></tr>${LV.map(row).join('')}</table></div></div></section>`}

function tests(){const b=S.best;return `<section><div class="w"><h2>${I('timer','Mock tests')}</h2><p class="mut">Timed MCQ practice. Each sample test has 5 questions and 3 minutes.</p><div class="grid">${Object.entries(T).map(([k,t])=>`<div class="card"><h3>${t.n}</h3><div class="mut">Best score: ${b[k]!=null?b[k]+'/5':'not attempted'}</div><button class="btn" onclick="st('${k}')">${I('play','Start test')}</button></div>`).join('')}</div><div id="tq" style="margin-top:24px"></div></div></section>`}
function st(k){clearInterval(tmr);Q={k,i:0,s:0,t:180};tq();tmr=setInterval(()=>{if(!Q)return clearInterval(tmr);Q.t--;const e=$('#tm');if(e)e.textContent=Math.floor(Q.t/60)+':'+String(Q.t%60).padStart(2,'0');if(Q.t<=0)fin()},1000);$('#tq').scrollIntoView({behavior:'smooth'})}
function tq(){const t=T[Q.k],q=t.q[Q.i];$('#tq').innerHTML=`<div class="panel"><div class="row"><b>${t.n}</b><span class="mut" style="margin-inline-start:auto">Q${Q.i+1}/5 · ${I('clock')} <span id="tm">${Math.floor(Q.t/60)}:${String(Q.t%60).padStart(2,'0')}</span></span></div><div class="prog" style="margin:12px 0"><i style="width:${Q.i*20}%"></i></div><h3>${esc(q[0])}</h3>${q[1].map((o,j)=>`<button class="opt" onclick="an(${j},this)">${esc(o)}</button>`).join('')}</div>`;ico()}
function an(j,el){const q=T[Q.k].q[Q.i];document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=1;if(i==q[2])b.classList.add('ok')});if(j==q[2])Q.s++;else el.classList.add('no');setTimeout(()=>{if(!Q)return;Q.i++;Q.i>=5?fin():tq()},900)}
function fin(){if(!Q)return;clearInterval(tmr);const k=Q.k,s=Q.s;Q=null;if(S.best[k]==null||s>S.best[k])S.best[k]=s;save();$('#tq').innerHTML=`<div class="panel"><h3>Score: ${s}/5</h3><p>${s>=4?'Excellent work!':s>=2?'Good start. Review the topics you missed and retry.':'Keep practising. A tutor can help with the basics.'}</p><div class="row"><button class="btn" onclick="st('${k}')">${I('rotate-ccw','Retry')}</button><a class="btn alt" href="#/search">${I('search','Find a tutor')}</a></div></div>`;ico()}

function resrc(){return `<section><div class="w"><h2>${I('book-open','Free resources')}</h2><p class="mut">Download study aids as text files.</p><div class="grid">${RS.map((r,i)=>`<div class="card"><div class="feat">${I(r.i)}<div><h3 style="margin:0">${r.n}</h3><span class="mut">${r.d}</span></div></div><button class="btn alt sm" onclick="dl(${i})">${I('download','Download')}</button></div>`).join('')}</div></div></section>`}
function dl(i){const r=RS[i],a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.t],{type:'text/plain'}));a.download=r.n.replace(/\W+/g,'-').toLowerCase()+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Downloaded')}

function groups(){return `<section><div class="w"><h2>${I('users','Study group finder')}</h2><p class="mut">Join students preparing for the same exam in your area.</p><div class="grid">${S.gr.map(g=>{const j=S.joined.includes(g.id);return `<div class="card"><h3>${esc(g.n)}</h3><div class="mut">${esc(g.ex)} · ${esc(g.a)} · ${g.m+(j?1:0)} members</div><button class="btn sm ${j?'alt':''}" onclick="jg(${g.id})">${I(j?'log-out':'user-plus',j?'Leave group':'Join group')}</button></div>`}).join('')}</div>
<form class="panel" style="max-width:520px;margin-top:24px" onsubmit="ng(event)"><h3>Start a group</h3><label>Group name</label><input name="n" required maxlength="60"><label>Exam</label><select name="ex">${opts(LV)}</select><label>Area</label><select name="a">${opts(AR)}</select><button class="btn" style="margin-top:14px">${I('plus','Create group')}</button></form></div></section>`}

function safety(){return `<section><div class="w" style="max-width:720px"><h2>${I('shield-check','Parent safety guide')}</h2><div class="grid" style="grid-template-columns:1fr">${[['Meet first','Meet the tutor with a parent present and start with a demo class.'],['Check proof','Look for the Verified badge and read recent reviews. Ask for ID and qualifications.'],['Keep it open','Hold home lessons in a shared room with the door open.'],['Pay monthly','Confirm fees in writing and never pay months in advance.'],['Report concerns','Use the Report button on a listing if anything feels wrong.']].map(f=>`<div class="card feat">${I('check-circle-2')}<div><h3 style="margin:0">${f[0]}</h3><span class="mut">${f[1]}</span></div></div>`).join('')}</div><p class="note">${I('phone-call')}<span>Emergencies in Karachi: Police 15, Rescue 1122.</span></p></div></section>`}

function me(){const l=S.saved.map(get).filter(Boolean),mine=S.extra;return `<section><div class="w"><h2>${I('user','My space')}</h2><h3>Saved (${l.length})</h3>${l.length?`<div class="grid">${l.map(card).join('')}</div>`:'<p class="mut">Nothing saved yet. Tap Save on any listing.</p>'}
<h3 style="margin-top:28px">My demo requests (${S.req.length})</h3>${S.req.map((r,i)=>`<div class="card row" style="flex-direction:row;margin-bottom:10px"><div><b>${esc(get(r.l)?.n||'Listing')}</b><div class="mut">${esc(r.n)} · ${esc(r.p)} · ${esc(r.tm||'any time')} · ${esc(r.d)}</div></div><button class="btn red sm" style="margin-inline-start:auto" onclick="cr(${i})">${I('x','Cancel')}</button></div>`).join('')||'<p class="mut">No requests yet.</p>'}
<h3 style="margin-top:28px">My listings (${mine.length})</h3>${mine.map(x=>`<div class="card row" style="flex-direction:row;margin-bottom:10px"><div><b>${esc(x.n)}</b><div class="mut">${x.ok?'Live':'Waiting for admin approval'}</div></div><button class="btn red sm" style="margin-inline-start:auto" onclick="del(${x.id})">${I('trash-2','Delete')}</button></div>`).join('')||'<p class="mut">You have not listed anything. <a href="#/join">List yourself</a>.</p>'}</div></section>`}

function join(){return `<section><div class="w" style="max-width:640px"><h2>${I('user-plus','List yourself')}</h2><p class="mut">Tutors and academies can list for free. An admin reviews new listings before they appear.</p><form class="panel" onsubmit="jn(event)"><label>Name</label><input name="n" required maxlength="60"><label>I am a</label><select name="t"><option value="t">Tutor</option><option value="a">Academy</option></select><label>Area</label><select name="a">${opts(AR)}</select><label>Levels</label><div class="chips" style="margin:0">${LV.map(l=>`<label style="display:flex;gap:5px;margin:0;align-items:center;color:var(--ink)"><input type="checkbox" style="width:auto" name="l" value="${l}">${l}</label>`).join('')}</div><label>Subjects (comma separated)</label><input name="s" required placeholder="Physics, Maths"><label>Fee per month (Rs)</label><input name="f" type="number" min="500" required><label>Mode</label><select name="m"><option>Home</option><option>Academy</option><option>Online</option></select><label>WhatsApp number (92300XXXXXXX)</label><input name="ph" required pattern="92[0-9]{10}"><label>Short bio</label><textarea name="b" required maxlength="250"></textarea><p class="mut">After approval, send your degree and CNIC to get the Verified badge. Documents are never public.</p><button class="btn">${I('send','Submit listing')}</button></form></div></section>`}

function admin(){if(!adm){const p=prompt('Admin PIN (demo PIN: 1234)');if(p==='1234')adm=1;else return `<section><div class="w">Access denied. <a href="#/">Home</a></div></section>`}
const p=S.extra.filter(x=>!x.ok);return `<section><div class="w"><div class="row"><h2 style="margin:0">${I('settings','Admin panel')}</h2><button class="btn alt sm" style="margin-inline-start:auto" onclick="adm=0;location.hash='#/'">${I('log-out','Log out')}</button></div><h3 style="margin-top:20px">Pending (${p.length})</h3>${p.map(x=>`<div class="card" style="margin-bottom:10px"><b>${esc(x.n)}</b> · ${esc(x.a)}<span class="mut">${esc(x.b)}</span><div class="row"><button class="btn sm" onclick="ap(${x.id},1)">${I('check','Approve')}</button><button class="btn red sm" onclick="ap(${x.id},0)">${I('x','Reject')}</button></div></div>`).join('')||'<p class="mut">None.</p>'}
<h3>Verification</h3><div class="sc"><table><tr><th>Listing</th><th>Verified</th><th></th></tr>${all().filter(x=>x.ok).map(x=>`<tr><td>${esc(x.n)}</td><td>${ver(x)?'Yes':'No'}</td><td><button class="btn sm alt" onclick="S.vo[${x.id}]=${ver(x)?0:1};save();route()">${I('badge-check','Toggle')}</button></td></tr>`).join('')}</table></div>
<h3 style="margin-top:24px">Reports (${S.rep.length})</h3>${S.rep.map((r,i)=>`<div class="row" style="margin-bottom:6px"><span>${esc(get(r.l)?.n)}: ${esc(r.d)}</span><button class="btn sm red" onclick="S.rep.splice(${i},1);save();route()">${I('x','Dismiss')}</button></div>`).join('')||'<p class="mut">None.</p>'}</div></section>`}

function tg(id){const a=S.saved,i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);save();toast(i<0?'Saved to My space':'Removed from saved');route(1)}
function tc(id){const i=cmp.indexOf(id);if(i<0){if(cmp.length>=3){toast('You can compare up to 3');return route(1)}cmp.push(id)}else cmp.splice(i,1);bar();if(location.hash.startsWith('#/search'))res()}
function bar(){$('#cb').innerHTML=cmp.length?`<div class="bar">${cmp.length} selected <a class="btn sm" href="#/compare">${I('git-compare','Compare')}</a><button class="btn sm alt" onclick="cmp=[];bar();route(1)">${I('x','Clear')}</button></div>`:'';ico()}
function sh(id){const x=get(id),u=location.href;if(navigator.share)navigator.share({title:x.n+' on Sabaq',url:u}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>toast('Link copied'),()=>toast(u));else toast(u)}
function rq(e,l){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));S.req.push({l,n:d.n,p:d.p,tm:d.tm,d:new Date().toLocaleDateString('en-GB')});save();toast('Request sent. You can now post a review.');route(1)}
function cr(i){S.req.splice(i,1);save();toast('Request cancelled');route(1)}
function rv(e,l){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));S.rev.push({l,w:d.w,s:+d.s,t:d.t,v:1});save();toast('Review posted');route(1)}
function rp(l){const r=prompt('What is the problem with this listing?');if(r&&r.trim()){S.rep.push({l,d:r.trim().slice(0,200)});save();toast('Report sent to admin')}}
function jg(id){const i=S.joined.indexOf(id);i<0?S.joined.push(id):S.joined.splice(i,1);save();route(1)}
function ng(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));S.gr.push({id:Date.now(),n:d.n,ex:d.ex,a:d.a,m:1});S.joined.push(S.gr[S.gr.length-1].id);save();toast('Group created');route(1)}
function jn(e){e.preventDefault();const f=new FormData(e.target),d=Object.fromEntries(f),l=f.getAll('l');if(!l.length)return toast('Pick at least one level');
S.extra.push({id:Date.now(),t:d.t,n:d.n,a:d.a,l,s:d.s.split(',').map(v=>v.trim()).filter(Boolean),f:+d.f,m:[d.m],g:'B',x:0,r:4,v:0,b:d.b,h:'New listing',ok:0,ph:d.ph});save();toast('Submitted. Waiting for admin approval.');location.hash='#/me'}
function ap(id,y){const i=S.extra.findIndex(x=>x.id==id);y?S.extra[i].ok=1:S.extra.splice(i,1);save();route(1)}
function del(id){S.extra=S.extra.filter(x=>x.id!=id);save();toast('Listing deleted');route(1)}
function lang(){S.lang=S.lang=='en'?'ur':'en';save();route(1)}

function links(){const h=location.hash.split('/')[1]||'';const L=[['search','search','find'],['match','wand-sparkles','match'],['fees','wallet','fees'],['tests','timer','tests'],['resources','book-open','res'],['groups','users','groups'],['safety','shield-check','safety'],['me','user','me']];
$('#links').innerHTML=L.map(l=>`<a href="#/${l[0]}" class="${h==l[0]?'on':''}">${I(l[1])}${tx(l[2])}</a>`).join('')+`<button class="btn ghost sm" onclick="lang()" aria-label="Switch language">${I('languages',S.lang=='en'?'اردو':'English')}</button><a class="btn sm" href="#/join" style="color:#fff">${I('plus',tx('list'))}</a>`}
function route(keep){const h=location.hash||'#/',y=scrollY,[,p,id]=h.split('/');document.documentElement.dir=S.lang=='ur'?'rtl':'ltr';
$('#links').classList.remove('open');links();
$('#app').innerHTML=({'':home,search,p:()=>prof(id),compare:cmpv,match,fees,tests,resources:resrc,groups,safety,me,join,admin})[p||'']?.()||home();
if(p=='search')res();bar();ico();scrollTo(0,keep?y:0)}
addEventListener('hashchange',()=>{if(Q){clearInterval(tmr);Q=null}route()});addEventListener('load',route);route();
</script></body></html>
