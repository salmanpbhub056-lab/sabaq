<div class="stats">${[['users',n.length,'Listings'],['badge-check',vn,'Verified'],['map-pin',ar,'Areas covered'],['star',av,'Average rating']].map(s=>`<div class="stat">${I(s[0])}<b>${s[1]}</b><span>${s[2]}</span></div>`).join('')}</div></div></div>

<section style="background:#fff"><div class="w"><div class="sh"><h2>Exam countdown</h2><p class="mut">Dates are tentative. Confirm with the official board or university notice.</p></div><div class="grid">${EX.map(e=>{const d=Math.ceil((new Date(e[1])-new Date())/864e5);return `<div class="cd">${I('calendar-clock')}<div><b>${d>0?d:'—'}</b> <span class="mut">${d>0?'days to go':'check new date'}</span><div style="font-weight:600">${e[0]}</div></div></div>`}).join('')}</div></div></section>

const own=u&&x.uid==u.id,rvs=S.rev.filter(v=>v.l==x.id).sort((a,b)=>(b.d|0)-(a.d|0)),mr=u&&S.req.find(r=>r.l==x.id&&r.uid==u.id&&['new','accepted'].includes(r.st)),done=u&&rvs.some(v=>v.uid==u.id),wa=`https://wa.me/${x.ph}?text=${encodeURIComponent('Salam, I found you on Sabaq and would like a demo class.')}`;
if(live(x)&&!own&&!VW[x.id]){VW[x.id]=1;api('view',{id:x.id})}

return `<section><div class="w"><a href="#/search" class="btn ghost sm">${I('arrow-left','Back to results')}</a>${own&&!live(x)?`<div class="note" style="margin-top:14px">${I('info')}<span>Preview only. Status: <b>${x.st}</b>. ${esc(x.note||'')}</span></div>`:''}<div class="lay" style="margin-top:16px;grid-template-columns:1fr 300px"><div><div class="top">${av(x,68)}<div><h1 style="font-size:1.8rem;margin:0">${esc(x.n)}</h1><div class="mut">${x.t=='a'?'Academy':'Tutor'} · ${I('map-pin')} ${esc(x.a)}, Karachi · ${x.x} years</div></div></div>
<p>${ver(x)?`<span class="tag v">${I('shield-check','Verified: documents reviewed by Sabaq')}</span>`:x.vs=='pending'?'<span class="tag s">Verification in review</span>':'<span class="tag">Not verified yet</span>'}${x.feat?'<span class="tag" style="background:#fff3cd;color:#8a6100">Featured</span>':''}<span class="tag"><span class="star">${I('star')}</span> ${rating(x).toFixed(1)}</span></p><p>${esc(x.b)}</p>
<div class="sc"><table><tr><th>Levels</th><td>${x.l.join(', ')}</td></tr><tr><th>Subjects</th><td>${x.s.map(esc).join(', ')}</td></tr><tr><th>Fee</th><td>${pkr(x.f)} per month</td></tr><tr><th>Mode</th><td>${x.m.join(', ')}</td></tr><tr><th>${x.t=='a'?'Facilities':'Timings'}</th><td>${esc(x.h)}</td></tr></table></div>
<p class="row"><a class="btn" href="${wa}" target="_blank" rel="noopener">${I('message-circle','WhatsApp')}</a><a class="btn alt" href="tel:+${x.ph}">${I('phone','Call')}</a><a class="btn alt" target="_blank" rel="noopener" href="https://www.google.com/maps/search/${encodeURIComponent(x.n+' '+x.a+' Karachi')}">${I('map','Map')}</a><button class="btn alt" onclick="tg(${x.id})">${I('heart',S.saved.includes(x.id)?'Saved':'Save')}</button><button class="btn alt" onclick="tc(${x.id});toast('Compare list updated')">${I('git-compare','Compare')}</button><button class="btn alt" onclick="sh(${x.id})">${I('share-2','Share')}</button></p>
<h2>Reviews (${rvs.length})</h2>${rvs.map(v=>`<div class="card" style="margin-bottom:10px"><div><span class="star">${I('star')}</span> <b>${v.s}/5</b> · ${esc(v.w)} ${v.v?`<span class="tag v">${I('check','Verified booking')}</span>`:''}${v.ed?'<span class="mut"> (edited)</span>':''}</div>${esc(v.t)}${v.reply?`<div class="note" style="margin-top:6px">${I('corner-down-right')}<span><b>Reply from ${esc(x.n)}:</b> ${esc(v.reply)}</span></div>`:''}</div>`).join('')||'<p class="mut">No reviews yet.</p>'}${rform}</div>
<aside>${qform}${own||!live(x)?'':`<details class="rpt" style="margin-top:14px"><summary class="btn red sm" style="display:inline-flex">${I('flag','Report this listing')}</summary>${u?`<form class="panel" style="margin-top:10px" onsubmit="rp(event,${x.id})"><label>Reason</label><select name="r">${['Fake profile or documents','Wrong information','Inappropriate behaviour','Asked for advance payment or scam','Other'].map(o=>`<option>${o}</option>`).join('')}</select><label>Details</label><textarea name="t" required minlength="10" maxlength="300"></textarea><button class="btn red sm" style="margin-top:10px">Send report</button></form>`:lg}</details>`}</aside></div></div></section>`}

if(!l.length)return err('Pick at least one level.');if(!m.length)return err('Pick at least one mode.');if(!/^92\d{10}$/.test(d.ph))return err('WhatsApp number must look like 923001234567.');
const mm=modr(d.b)||modr(d.h)||modr(d.n);if(mm)return err('Name, bio and timings: '+mm);

if(tot>3.4e6)throw'The files are too large in total. Please use smaller files.'}catch(x){b.disabled=0;return err(typeof x=='string'?x:'Could not read a file.')}
